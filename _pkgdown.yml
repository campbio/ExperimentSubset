url: https://campbio.github.io/ExperimentSubset/

template:
  bootstrap: 5

# In CI, PKGDOWN_DEV_MODE overrides this: the release site is built at the
# root and the devel site in /dev/ (see .github/workflows/pkgdown.yaml).
development:
  mode: auto

articles:
- title: Workflows
  navbar: Workflows
  contents:
  - articles/pbmc-workflow

reference:
- title: Constructor and classes
  contents:
  - ExperimentSubset
  - ends_with("-class")
- title: Creating and managing subsets
  contents:
  - createSubset
  - subsetNames
  - subsetCount
  - subsetDim
  - subsetParent
  - subsetSummary
  - subsetAssayNames
  - subsetAssayCount
  - ExperimentSubset-subsetting
  - ExperimentSubset-combine
- title: Getting and setting subset data
  contents:
  - getSubsetAssay
  - setSubsetAssay
  - getSubsetExperiment
  - setSubsetExperiment
  - subsetRowData
  - subsetColData
  - subsetRownames
  - subsetColnames
- title: Class-specific accessors
  desc: >
    Tree links of a TreeSummarizedExperiment and spatial data of a
    SpatialExperiment, for a subset.
  contents:
  - subsetRowLinks
  - subsetColLinks
  - subsetSpatialCoords
  - subsetSpatialData
- title: Methods that take subsetName
  desc: >
    Methods of Bioconductor generics that read or set a subset's data when
    given subsetName, and otherwise act on the main object. Besides those
    below, these include assay(), assay<-, rowData(), colData(),
    reducedDim(), reducedDims(), altExp(), altExps(), altExpNames(),
    metadata() and their setters.
  contents:
  - starts_with("reducedDim")
