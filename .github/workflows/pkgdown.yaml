# Builds the pkgdown site and deploys it to the gh-pages branch.
#
#   - devel: the devel version, built into /dev/ on each push to devel and
#     on manual dispatch from devel. Pull requests to devel that touch the
#     site's sources only build it. If the site has no home page yet (no
#     release site), the first devel deploy adds one that sends readers to
#     /dev/; the release site replaces it.
#   - release: the current release, built at the root from master after
#     "Sync stable branch" updates it, and on manual dispatch from master.
#     The sync pushes with a bot token, which doesn't start workflows, but
#     workflow_run does fire. The build is skipped when master hasn't
#     changed since the last deploy; a manual dispatch always rebuilds.
#     workflow_run only runs from the default branch, so this job starts
#     working once this file is on master.
#
# Each site is built in a Bioconductor container with read-only
# permissions; only the deploy jobs, which run no package code, can write.
# After the first deploy, enable GitHub Pages in the repository settings
# with source gh-pages.
name: pkgdown

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - 'inst/**'
      - '_pkgdown.yml'
      - 'DESCRIPTION'
      - 'README.md'
      - 'NEWS.md'
      - '.Rbuildignore'
      - '.github/workflows/pkgdown.yaml'
  workflow_run:
    workflows: ['Sync stable branch']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devel-build:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/devel')
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:devel
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Leave the agent instruction files out of the site
        # pkgdown renders every top-level .md file, and has no setting to
        # skip one; these are notes for coding agents, not documentation
        run: rm -f AGENTS.md CLAUDE.md
        shell: bash

      - name: Install the package and the site's dependencies
        # Config/Needs/website lists pkgdown and the articles' packages
        run: |
          BiocManager::install("remotes", update = FALSE, ask = FALSE)
          deps <- remotes::local_package_deps(dependencies = TRUE)
          website <- read.dcf("DESCRIPTION", "Config/Needs/website")
          website <- trimws(strsplit(website, ",")[[1]])
          website <- website[!is.na(website) & nzchar(website)]
          BiocManager::install(c(deps, website), update = FALSE, ask = FALSE)
          remotes::install_local(".", dependencies = FALSE, upgrade = "never")
        shell: Rscript {0}

      - name: Build the devel site into site/dev
        env:
          PKGDOWN_DEV_MODE: devel
        run: |
          pkgdown::build_site_github_pages(dest_dir = "site",
                                           new_process = FALSE,
                                           install = FALSE)
        shell: Rscript {0}

      - name: Upload the devel site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: devel-site
          path: site/dev
          include-hidden-files: true

  devel-deploy:
    needs: devel-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One group per site: a newer pending job in a group cancels an older
    # pending one, which must not drop a release deploy. Pushes to gh-pages
    # from the two groups are retried by the deploy action. This job never
    # replaces the root, so the two can't overwrite each other's files.
    concurrency:
      group: gh-pages-devel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: devel-site
          path: devel-site

      - name: Deploy the devel site to /dev/
        # v4.9.0
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          branch: gh-pages
          folder: devel-site
          target-folder: dev
          commit-message: Deploy the devel site

      - name: Check whether the site has a home page
        id: home
        run: |
          page="https://raw.githubusercontent.com/$REPO/gh-pages/index.html"
          if curl -fsI "$page" > /dev/null; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
        shell: bash

      - name: Write a home page that sends readers to /dev/
        if: steps.home.outputs.missing == 'true'
        run: |
          mkdir home
          printf '%s\n' '<!DOCTYPE html>' \
            '<meta http-equiv="refresh" content="0; url=dev/">' \
            '<link rel="canonical" href="dev/">' \
            '<a href="dev/">ExperimentSubset documentation</a>' \
            > home/index.html
          touch home/.nojekyll
        shell: bash

      - name: Add the home page, changing nothing else
        if: steps.home.outputs.missing == 'true'
        # v4.9.0
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          branch: gh-pages
          folder: home
          clean: false
          commit-message: Add a home page that points to /dev/

  release-check:
    # Decides on a bare runner whether to build, so the large release image
    # is only pulled when master changed
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.master.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: master
        with:
          ref: master

      - name: Decide whether to build
        id: decide
        run: |
          # the commit the deployed release site was built from, if any
          page="https://raw.githubusercontent.com/$REPO/gh-pages/release-sha.txt"
          last="$(curl -fsSL "$page" || true)"
          if [ ! -f _pkgdown.yml ]; then
            echo "master has no _pkgdown.yml; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "workflow_dispatch" ] && [ "$last" = "$SHA" ]; then
            echo "The release site is already built from $SHA."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.master.outputs.commit }}
        shell: bash

  release-build:
    needs: release-check
    if: needs.release-check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      # Bump the RELEASE tag each Bioconductor cycle, as in R-CMD-check.yaml.
      image: bioconductor/bioconductor_docker:RELEASE_3_24
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-check.outputs.sha }}

      - name: Leave the agent instruction files out of the site
        # pkgdown renders every top-level .md file, and has no setting to
        # skip one; these are notes for coding agents, not documentation
        run: rm -f AGENTS.md CLAUDE.md
        shell: bash

      - name: Install the package and the site's dependencies
        run: |
          BiocManager::install("remotes", update = FALSE, ask = FALSE)
          deps <- remotes::local_package_deps(dependencies = TRUE)
          website <- read.dcf("DESCRIPTION", "Config/Needs/website")
          website <- trimws(strsplit(website, ",")[[1]])
          website <- website[!is.na(website) & nzchar(website)]
          BiocManager::install(c(deps, website), update = FALSE, ask = FALSE)
          remotes::install_local(".", dependencies = FALSE, upgrade = "never")
        shell: Rscript {0}

      - name: Build the release site
        env:
          PKGDOWN_DEV_MODE: release
        run: |
          pkgdown::build_site_github_pages(dest_dir = "site",
                                           new_process = FALSE,
                                           install = FALSE)
        shell: Rscript {0}

      - name: Record the commit the site was built from
        run: echo "$SHA" > site/release-sha.txt
        env:
          SHA: ${{ needs.release-check.outputs.sha }}
        shell: bash

      - name: Upload the release site
        uses: actions/upload-artifact@v4
        with:
          name: release-site
          path: site
          include-hidden-files: true

  release-deploy:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-site
          path: release-site

      - name: Deploy the release site to the root, keeping /dev/
        # v4.9.0
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          branch: gh-pages
          folder: release-site
          clean-exclude: dev
          commit-message: Deploy the release site
