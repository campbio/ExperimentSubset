# R CMD check.
#
# Fast feedback everywhere, full cross-platform matrix only on integration:
#   - Linux (Bioc-devel and Bioc-release) runs on every push and pull
#     request, inside the Bioconductor docker images so the R / Bioc
#     versions and system libraries match the Bioconductor build machines,
#     and Bioconductor dependencies come prebuilt in the image.
#   - macOS and Windows run only on push to devel or RELEASE_* (i.e. when a
#     branch is incorporated) or on manual dispatch.
#
# The stable branch (master) is a CI-maintained copy of the current
# release, so it isn't checked here.
#
# NOTE for branch protection: keep the Linux jobs as the required status
# checks. macOS/Windows do not run on pull_request, so they must NOT be
# required or PRs can never merge.
on:
  push:
    branches: [devel, 'RELEASE_*']
  pull_request:
    branches: [devel, 'RELEASE_*']
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    name: ${{ matrix.bioc.name }}
    container:
      image: ${{ matrix.bioc.image }}
    strategy:
      fail-fast: false
      matrix:
        bioc:
          # Bump the RELEASE tag each Bioconductor cycle (~April/October).
          - {name: bioc-devel,   image: "bioconductor/bioconductor_docker:devel"}
          - {name: bioc-release, image: "bioconductor/bioconductor_docker:RELEASE_3_23"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # Resolve everything through BiocManager so versions stay coherent
        # with the container's Bioc (remotes only LISTS the deps).
        run: |
          BiocManager::install(c("rcmdcheck", "remotes"), update = FALSE, ask = FALSE)
          deps <- remotes::local_package_deps(dependencies = TRUE)
          BiocManager::install(deps, update = FALSE, ask = FALSE)
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bioc.name }}-check-results
          path: check

  windows-macos:
    # Full cross-platform matrix only when incorporating a branch (push to
    # devel or RELEASE_*, which the trigger above restricts) or on manual
    # dispatch -- never on pull_request, to keep PR feedback fast.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
