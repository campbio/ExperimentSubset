# Test coverage, uploaded to Codecov.
#
# Runs the test suite under covr on every push to devel and every pull
# request to devel, and uploads the result with the CODECOV_TOKEN
# repository secret. Pull requests from forks can't read the secret, so
# their upload may fail; that doesn't fail the job. Thresholds for the
# Codecov status checks are in codecov.yml. Keep this job out of the
# required status checks.
#
# Same setup as celda and decontX (derived from
# https://github.com/r-lib/actions/tree/v2/examples).
on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
  workflow_dispatch:

name: test-coverage

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
